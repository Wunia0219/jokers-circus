name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [browser, discord, wallet, services]
    env:
      WRANGLER_SEND_METRICS: 'false'
      FIRESTORE_LIVE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: matrix.suite == 'wallet' || matrix.suite == 'services'
        with:
          distribution: temurin
          java-version: '21'
      - name: Check toolchain configuration
        run: node scripts/qa/check-toolchain.js
      - run: npm install --global npm@12.2.1
      - run: npm ci
      - run: npm audit --audit-level=high
        if: matrix.suite == 'browser'
      - name: Cache matching Chromium build
        if: matrix.suite == 'browser' || matrix.suite == 'discord'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      # Verify the locked browser and install uncached OS dependencies on every run.
      - run: npx playwright install --with-deps chromium
        if: matrix.suite == 'browser' || matrix.suite == 'discord'
      - name: Cache pinned Firestore emulator
        if: matrix.suite == 'wallet' || matrix.suite == 'services'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .tools/cloud-firestore-emulator-v*.jar
          key: firestore-emulator-${{ hashFiles('scripts/setup/setup-firestore-emulator.js') }}
      # setup rechecks the pinned SHA-256 even on a cache hit.
      - run: npm run firestore:emulator:setup
        if: matrix.suite == 'wallet' || matrix.suite == 'services'
      - run: npm run verify:ci -- --suite=${{ matrix.suite }}
      - name: Build and inspect the Node delivery image
        if: matrix.suite == 'services'
        run: |
          docker build --tag jokers-circus:ci .
          docker run --rm --entrypoint node jokers-circus:ci --input-type=module -e "await import('./server/http/app.js'); await import('./server/recovery/wallet-recovery.js');"
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            test-results/verification.json
            test-results/browser-runtime.json
            test-results/discord-sdk/*.json
            test-results/discord-test-activity/report.json
            test-results/discord-test-activity/failure.json
            test-results/discord-test-activity/timings.json
            test-results/discord-test-activity/failure*.png
            test-results/yakyuken-reward/report.json
            test-results/yakyuken-reward/failure.json
            test-results/arcade-production/report.json
            test-results/arcade-preflight/*/report.json
            test-results/startup-resources/*.json
            test-results/dealer-resources/*.json
            test-results/number-rendering/*.json
            test-results/reel-experience/*.json
            test-results/reel-experience-stress/*.json
            test-results/security-smoke/run-*/report.json
            test-results/security-smoke/run-*/failure.json

  verify:
    name: verify
    if: always()
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - name: Require every verification suite
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: test "$CHECKS_RESULT" = success
